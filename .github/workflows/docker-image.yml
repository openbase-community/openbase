# Build and publish the openbaseai/openbase Docker image (linux/amd64 +
# linux/arm64) on pushes to main that touch the image inputs. Each platform
# builds natively on its own runner (no QEMU), pushes by digest, and a final
# job merges the digests into the multi-arch latest + version tags.
#
# Staging promotions dispatch it on the staging ref with a maritime-<sha> tag
# and platforms=amd64 (Maritime runs x86_64), right after the push and in
# parallel with the staging CLI release: the version stamp is computed, not
# read from the release tag (.github/scripts/release-version.sh).
#
# Requires the DOCKERHUB_TOKEN repo secret (a Docker Hub access token for the
# openbaseai account; override the username with a DOCKERHUB_USERNAME
# secret). Without the token the workflow warns and skips publishing rather
# than failing the push.
name: Docker Image

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "openbase_coder_cli/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-image.yml"
      - ".github/scripts/release-version.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Publish ONLY this image tag (for example maritime-<sha>) instead of
          latest + version. Use it to ship a test image from a non-main ref
          without moving latest.
        required: false
        default: ""
      platforms:
        description: >-
          Platforms to build. Maritime cloud workspaces run amd64 only, so a
          staging image for them skips the arm64 build.
        type: choice
        options: [all, amd64]
        default: all

env:
  IMAGE: openbaseai/openbase

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      sibling_ref: ${{ steps.siblings.outputs.ref }}
      sibling_revs: ${{ steps.siblings.outputs.revs }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_TOKEN secret is not set; skipping image publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        # Valid PEP 440 stamp; on staging it is the version of the staging
        # release the same push cuts, so the image need not wait for its tag.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(.github/scripts/release-version.sh stamp "$REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          amd64='{"platform":"linux/amd64","slug":"amd64","runner":"ubuntu-latest"}'
          arm64='{"platform":"linux/arm64","slug":"arm64","runner":"ubuntu-24.04-arm"}'
          if [ "$PLATFORMS" = "amd64" ]; then
            echo "matrix=[$amd64]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[$amd64,$arm64]" >> "$GITHUB_OUTPUT"
          fi
      - id: siblings
        # The image clones sibling repos at build time. Use the branch being
        # built (a staging image bundles staging's console, skills and
        # super-agents), and pass their head SHAs as a build arg: an
        # unchanged clone line is otherwise served from the layer cache
        # after the remote moved (staging images shipped a cached console).
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            main|staging) ref="$REF_NAME" ;;
            *) ref=develop ;;
          esac
          revs=""
          while read -r repo branch; do
            sha="$(git ls-remote "https://github.com/$repo" "refs/heads/$branch" | cut -f1)"
            if [ -z "$sha" ]; then
              echo "::error::$repo has no branch $branch"
              exit 1
            fi
            echo "$repo@$branch = $sha"
            revs="$revs${sha:0:12},"
          done <<EOF
          openbase-community/openbase-coder-console $ref
          openbase-community/openbase-coder-react $ref
          montaguegabe/multi-react main
          montaguegabe/boilersync-react main
          montaguegabe/super-agents $ref
          openbase-community/openbase-coder-skills $ref
          openbase-community/openbase-coder-workspace $ref
          EOF
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "revs=$revs" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'openbaseai' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            OPENBASE_CODER_VERSION=${{ needs.preflight.outputs.version }}
            SIBLING_REVS=${{ needs.preflight.outputs.sibling_revs }}
            CONSOLE_REF=${{ needs.preflight.outputs.sibling_ref }}
            CODER_REACT_REF=${{ needs.preflight.outputs.sibling_ref }}
            SUPER_AGENTS_REF=${{ needs.preflight.outputs.sibling_ref }}
            SKILLS_REF=${{ needs.preflight.outputs.sibling_ref }}
            WORKSPACE_REF=${{ needs.preflight.outputs.sibling_ref }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-image-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=docker-image-${{ matrix.slug }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'openbaseai' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$CUSTOM_TAG" ]; then
            # A dispatch with a tag publishes that tag only; latest and the
            # version tag keep pointing at the last main build.
            tags="-t $IMAGE:$CUSTOM_TAG"
          else
            tags="-t $IMAGE:latest -t $IMAGE:${{ needs.preflight.outputs.version }}"
          fi
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
        run: docker buildx imagetools inspect "$IMAGE:${CUSTOM_TAG:-latest}"

  # Report-only vulnerability scan of the image that was just published, so
  # base-image and OS-package CVEs surface in the Security tab instead of
  # waiting for someone to scan the image by hand. Does not gate the release.
  scan:
    needs: [preflight, merge]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Run Trivy on published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # A dispatch with a custom tag publishes only that tag.
          image-ref: openbaseai/openbase:${{ inputs.tag || needs.preflight.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
