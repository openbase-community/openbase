# Auto-release: every push to main cuts a stable release with an
# auto-bumped version (minor by default), and every push to staging cuts a
# staging-channel release (.dev-suffixed version, GitHub prerelease) built
# from every sibling repo's staging HEAD. See the workspace AUTO_UPDATE.md.
#
# Commit-message overrides (checked on the head commit of the push):
#   [skip release]    — do not release this push
#   [release patch]   — bump the patch version instead of minor
#   [release major]   — bump the major version
#
# Pushes to main are production; staging releases serve only the staging
# channel and never releases/latest.
name: Auto Release

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: minor
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# A burst of pushes (multi pushes all subrepos together) cancels in-flight
# builds so the final push releases once, after everything has landed.
# Per-branch groups: a staging burst must not cancel a main release or
# vice versa. A [skip release] push must NOT cancel: its own run skips
# itself, so cancelling would leave the predecessor's release uncut with
# nothing replacing it (a silently dropped release).
concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.event.head_commit.message || '', '[skip release]') }}

jobs:
  plan:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', '[skip release]') }}
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          bump="${BUMP_INPUT:-minor}"
          message="${HEAD_COMMIT_MESSAGE:-}"
          case "$message" in
            *"[release patch]"*) bump="patch" ;;
            *"[release major]"*) bump="major" ;;
          esac

          # Staging versions (.dev0) and stable bumps: see the script.
          version="$(.github/scripts/release-version.sh next "${GITHUB_REF_NAME}" "$bump")"
          echo "Auto-release: ${version} (${bump}, ${GITHUB_REF_NAME})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    uses: ./.github/workflows/release-standalone.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      draft: false
      sibling_ref: ${{ github.ref_name }}
    secrets: inherit
