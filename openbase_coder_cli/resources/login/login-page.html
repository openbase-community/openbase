<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${page_title}</title>
    <style>
      :root {
        --ink: #0e0a07;
        --muted: #475569;
        --faint: #94a3b8;
        --brand: #2352de;
        --line: #dbeafe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #edf4f9;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .frame {
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 16px);
        margin: 8px;
        padding: 24px 20px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: #f9fbfd;
        box-shadow: 0 30px 80px -48px rgba(24, 73, 139, 0.45);
      }
      .logo svg { display: block; height: 32px; width: auto; max-width: 180px; }
      main {
        width: 100%;
        max-width: 480px;
        margin: auto;
        padding: 48px 0;
      }
      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        margin-bottom: 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--brand);
        box-shadow: 0 10px 30px -20px rgba(35, 82, 222, 0.5);
      }
      .eyebrow {
        margin: 0 0 12px;
        color: var(--brand);
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 2.75rem;
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1.05;
      }
      .subtitle { margin: 12px 0 32px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
      .card {
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 18px 40px -30px rgba(24, 73, 139, 0.35);
      }
      .card ul { margin: 0; padding: 0; list-style: none; }
      .card li { display: flex; gap: 12px; color: #334155; font-size: 0.875rem; line-height: 1.6; }
      .card li + li { margin-top: 14px; }
      .step {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #eff6ff;
        color: var(--brand);
        font-size: 0.75rem;
        font-weight: 600;
      }
      .card strong { color: var(--ink); font-weight: 600; }
      .button {
        display: block;
        margin-top: 22px;
        padding: 12px 16px;
        border-radius: 10px;
        background: var(--ink);
        color: #fff;
        font-size: 0.9rem;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
      }
      .button:hover { background: var(--brand); }
      .button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
      .close-note { margin: 24px 0 0; color: var(--muted); font-size: 0.8rem; text-align: center; }
      footer { color: var(--faint); font-size: 0.65rem; line-height: 1.25rem; text-align: center; }
      @media (min-width: 640px) {
        .frame { margin: 12px; min-height: calc(100vh - 24px); padding: 32px 40px; }
        .card { padding: 28px; }
      }
      @media (max-width: 420px) { h1 { font-size: 2.2rem; } }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="logo" aria-label="Openbase">${logo_svg}</div>
      <main>
        <div class="icon" aria-hidden="true">${icon_svg}</div>
        <p class="eyebrow">${eyebrow}</p>
        <h1>${heading}</h1>
        <p class="subtitle">${subtitle}</p>
        <div class="card">${card_html}</div>
        <p class="close-note">${close_note}</p>
      </main>
      <footer>Protected by Openbase Identity and secure, short-lived sessions.</footer>
    </div>
    ${script_html}
  </body>
</html>
